[workspace]
resolver = "3"
members = [
    "apps/runspur-cli",
    "crates/scheduler-core",
    "crates/scheduler-platform",
    "crates/scheduler-runtime",
    "crates/scheduler-app",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/ohmacemace/runspur"
authors = ["mace"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
hmac = "0.12"
rmcp = { version = "3.9", features = ["server", "transport-io", "macros"] }
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
