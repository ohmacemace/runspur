[package]
name = "runspur-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "runspur"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap.workspace = true
scheduler-app = { path = "../../crates/scheduler-app" }
scheduler-core = { path = "../../crates/scheduler-core" }
scheduler-platform = { path = "../../crates/scheduler-platform" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http = { version = "0.6", features = ["fs"] }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
windows-sys = { workspace = true, features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
