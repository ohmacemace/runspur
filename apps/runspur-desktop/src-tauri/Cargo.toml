[package]
name = "runspur-desktop"
version = "0.1.2"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
scheduler-app = { path = "../../../crates/scheduler-app" }
scheduler-core = { path = "../../../crates/scheduler-core" }
scheduler-platform = { path = "../../../crates/scheduler-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["fs", "sync", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
