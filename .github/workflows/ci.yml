name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build programs
        run: cargo build --workspace --locked
      - name: Check desktop smoke syntax
        run: node --check scripts/windows-desktop-smoke.cjs
      - name: Validate PowerShell scripts
        run: powershell.exe -NoProfile -File scripts/check-powershell.ps1
      - name: Package programs for installer regression tests
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed." }
          $tag = "v$($metadata.packages[0].version)"
          ./scripts/package-windows.ps1 -Tag $tag -BinaryDir target/debug -OutputDir "$env:RUNNER_TEMP/runspur-package"
      - name: Test PowerShell 5.1 installation and installed programs
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed." }
          $tag = "v$($metadata.packages[0].version)"
          powershell.exe -NoProfile -File scripts/test-distribution.ps1 -Tag $tag -PackageDir "$env:RUNNER_TEMP/runspur-package"
      - name: Verify latest-release bootstrap with PowerShell 7
        if: github.repository == 'ohmacemace/runspur'
        run: |
          $install = Join-Path $env:RUNNER_TEMP "runspur-public-bootstrap"
          ./install.ps1 -InstallDir $install -NoPathUpdate
          & (Join-Path $install "schedulerctl.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Public installer smoke failed." }
