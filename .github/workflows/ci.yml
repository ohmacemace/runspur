name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: Windows CLI
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/runspur-desktop/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build programs
        run: cargo build --workspace --locked
      - name: Validate PowerShell scripts
        run: powershell.exe -NoProfile -File scripts/check-powershell.ps1
      - name: Install browser panel dependencies
        working-directory: apps/runspur-desktop
        run: npm.cmd ci
      - name: Build browser panel
        working-directory: apps/runspur-desktop
        run: npm.cmd run ui:build
      - name: Pack and test the Windows x64 npm CLI
        timeout-minutes: 5
        run: |
          $output = Join-Path $env:RUNNER_TEMP "runspur-npm-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./scripts/package-npm.ps1 -BinaryDir target/debug -OutputDir $output
          $archives = @(Get-ChildItem -LiteralPath $output -Filter 'runspur-*.tgz' -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one npm tarball in $output." }
          powershell.exe -NoProfile -File scripts/test-npm-distribution.ps1 -PackagePath $archives[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "npm distribution smoke failed." }

  desktop:
    name: Windows desktop app
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: apps/runspur-desktop
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/runspur-desktop/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Cache desktop Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/runspur-desktop/src-tauri
      - name: Install Windows app dependencies
        run: npm.cmd ci
      - name: Build Windows app UI
        run: npm.cmd run ui:build
      - name: Check Windows app Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test Windows app Rust workspace
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
